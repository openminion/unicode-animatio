[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "unicode-animatio"
version = "0.0.10"
description = "Unicode and ASCII terminal animations as raw frame data for Python"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "unicode-animatio contributors" },
]
keywords = ["ascii", "braille", "spinner", "unicode", "animation", "loading", "cli", "terminal"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
  "Topic :: Terminals",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/openminion/unicode-animatio"
Repository = "https://github.com/openminion/unicode-animatio"
Documentation = "https://github.com/openminion/unicode-animatio/tree/main/docs"
Issues = "https://github.com/openminion/unicode-animatio/issues"
"Release Notes" = "https://github.com/openminion/unicode-animatio/releases"

[project.scripts]
unicode-animatio = "unicode_animations.cli:main"
unicode-animatio-web = "unicode_animations.web:main"

[project.entry-points."openminion.cli.animation_providers"]
unicode = "unicode_animations.provider:get_provider"

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "pre-commit>=4,<5",
  "pytest>=8.0.0",
  "ruff>=0.11.0",
  "tomli>=2.0.0; python_version < '3.11'",
  "wcwidth>=0.2.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/unicode_animations"]
